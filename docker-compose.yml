services:
  api:
    build: .
    volumes:
      - .:/app
      - m2_data:/root/.m2
    ports:
      - 3000:3000
    environment:
      - APP_ENV=development
      - DB_HOST=db
      - DB_NAME=demo
      - DB_USER=root
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # サーバーがポートで待ち受けているかを確かめる（イメージに curl がないので、bash の機能を使う）。
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/3000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  db:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: 'demo'
      TZ: 'Asia/Tokyo'
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - 33306:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
  m2_data:
